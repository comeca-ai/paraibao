name: paraibao-site
services:
  web:
    image: nginx:1.27-alpine
    container_name: paraibao-site
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge_certeiro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
networks:
  edge_certeiro:
    external: true
