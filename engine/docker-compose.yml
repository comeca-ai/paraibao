name: paraibao-engine

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - paraibao-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.75"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - paraibao-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      # Cache do proxy de imagem. Em volume porque o build recria o container.
      - paraibao-img:/var/cache/paraibao-img
      # Mídia própria (vídeos de cobertura). Fora do repo e fora da imagem:
      # subir vídeo não pode exigir rebuild, e apagar cobertura.json tira a
      # seção do ar sem deploy.
      - /srv/paraibao-media:/app/media:ro
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8787}:8000"
    networks:
      - default
      - edge_certeiro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    env_file: .env
    volumes:
      # Mesmo cache da api: o worker gera o card na hora de publicar e a api
      # serve esse mesmo arquivo quando a Meta vem buscar a imagem.
      - paraibao-img:/var/cache/paraibao-img
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.00"

volumes:
  paraibao-db:
  paraibao-redis:
  paraibao-img:

networks:
  edge_certeiro:
    external: true
