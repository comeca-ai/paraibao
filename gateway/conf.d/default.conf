server {
    listen 80;
    listen [::]:80;
    server_name paraibao.com.br www.paraibao.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://paraibao.com.br$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paraibao.com.br www.paraibao.com.br;
    ssl_certificate /etc/letsencrypt/live/paraibao.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paraibao.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    if ($host = www.paraibao.com.br) { return 301 https://paraibao.com.br$request_uri; }
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_types text/plain text/css application/json application/xml text/xml application/javascript image/svg+xml;
    gzip_min_length 512;
    client_max_body_size 8m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://paraibao-engine-api-1:8000;

    # Assets do design: cache longo, sao imutaveis na pratica.
    location /static/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
