# Painel de controle, em subdomínio próprio.
#
# Por que separar do domínio do jornal:
#   - quem varre a internet procurando /painel no site não acha mais nada
#   - no modelo white label cada praça ganha o seu subdomínio de painel, e a
#     administração não fica misturada com a superfície pública de todas
#
# O app também recusa as rotas de administração fora deste host
# (`somente_painel` em app/main.py). São duas barreiras de propósito: se um
# dia alguém apontar outro nome para este mesmo IP, o app continua negando.

server {
    listen 80;
    listen [::]:80;
    server_name painel.paraibao.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://painel.paraibao.com.br$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name painel.paraibao.com.br;

    ssl_certificate /etc/letsencrypt/live/painel.paraibao.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.paraibao.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Painel nunca deve ser indexado, e cabeçalho vale mesmo se alguém
    # esquecer a meta tag numa página nova.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;
    client_max_body_size 8m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # Por variável, e não pelo nome direto: com o nome direto o nginx resolve
    # o IP do contêiner uma vez, na subida, e passa a dar 502 assim que o
    # contêiner é recriado num deploy.
    set $api http://paraibao-engine-api-1:8000;

    location /static/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
